[package]
name = "creature-lab"
description = "Creature Voice Studio lab DSP: DNA effect rack, multilingual G2P, SFX synth, clip editor, offline renderer"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors = ["F7 Developer"]
publish = false

[dependencies]
chimera = { path = "../chimera" }
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

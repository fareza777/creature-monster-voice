[package]
name = "creature-wasm"
description = "Creature Voice Studio wasm module: the CHIMERA C ABI plus the lab ABI (no imports)"
version = "1.0.0"
edition.workspace = true
license.workspace = true
authors = ["F7 Developer"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chimera-wasm = { path = "../chimera-wasm" }
creature-lab = { path = "../creature-lab" }
serde_json = { version = "1", features = ["float_roundtrip"] }
